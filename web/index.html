  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #ffffff;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    // T4: 첫 Flutter 프레임 위에서 splash를 짧게 fade한 뒤 지운다(하드컷 방지).
    // 동작 줄이기에서는 바로 지운다. transitionend가 오지 않아도 타이머로 지운다.
    function removeSplashFromWeb() {
      var nodes = ["splash", "splash-branding"]
        .map(function (id) { return document.getElementById(id); })
        .filter(Boolean);
      document.body.style.background = "transparent";
      var reduce = window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) {
        nodes.forEach(function (n) { n.remove(); });
        return;
      }
      nodes.forEach(function (n) {
        n.style.position = "fixed";
        n.style.inset = "0";
        n.style.zIndex = "2147483647";
        n.style.pointerEvents = "none";
        n.style.background = "#ffffff";
        n.style.transition = "opacity 240ms ease-out";
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { n.style.opacity = "0"; });
        });
        setTimeout(function () { n.remove(); }, 320);
      });
    }
  </script>
