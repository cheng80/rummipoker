        <circle cx="35" cy="39" r="14" class="ink2"/>
        <path d="M35 16 L41 34 L59 34 L44 44 L50 62 L35 51 L20 62 L26 44 L11 34 L29 34 Z" fill="#efe7c5" opacity="0.86"/>
