<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#08130f" flood-opacity="0.42"/>
    </filter>
    <radialGradient id="surface" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#234436"/>
      <stop offset="1" stop-color="#101f1a"/>
    </radialGradient>
    <style>
      .label { font-family: Inter, Arial, sans-serif; font-weight: 900; letter-spacing: 0; }
      .name { font-size: 15px; fill: #edf8ef; }
      .tiny { font-size: 11px; fill: #12201a; }
      .type { font-size: 12px; fill: #f7fbf6; }
      .rank { font-size: 13px; fill: #07110d; }
      .caption { font-size: 13px; fill: #b7c8bf; font-weight: 800; }
      .ink { fill: none; stroke: #efe7c5; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .ink2 { fill: none; stroke: #d9a94a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.95; }
    </style>
  </defs>

  <rect width="980" height="320" fill="#0b1412"/>
  <text x="32" y="36" class="label" font-size="20" fill="#eef7f0">Rummi Poker card rarity/type UI examples</text>
  <text x="32" y="58" class="caption">Rarity uses label + color + border/shape. Type stays in the bottom badge. Center art remains separate.</text>

  <g transform="translate(34 86)">
